project_id = "hashimoto-frota"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["hashimotofrota://"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12

[auth.email]
# Mantem o provedor de email ativo. auth.enable_signup=false fecha o cadastro publico.
enable_signup = true
enable_confirmations = true
